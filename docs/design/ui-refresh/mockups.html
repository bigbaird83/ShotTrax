<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShotTraxx UI Refresh</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Liberation Sans", "DejaVu Sans", sans-serif; background: #E9E6DF; color: #1a1a1a; -webkit-font-smoothing: antialiased; }
  .board { padding: 56px 64px 64px; display: inline-block; min-width: 100%; }
  .board.dark { background: radial-gradient(1200px 700px at 20% 0%, #26302a 0%, #121614 60%); color: #EDEDED; }
  .board h1 { font-size: 40px; letter-spacing: -0.5px; margin-bottom: 8px; }
  .board .sub { font-size: 18px; opacity: .7; margin-bottom: 40px; max-width: 1100px; line-height: 1.45; }
  .row { display: flex; gap: 48px; align-items: flex-start; }
  .cap { text-align: center; margin-top: 18px; font-weight: 700; font-size: 18px; }
  .cap small { display: block; font-weight: 400; opacity: .65; font-size: 14px; margin-top: 4px; }

  /* ---------- Themes ---------- */
  .t-darklime  { --bg:#0B1A12; --bg2:#13261B; --text:#F4F1E8; --muted:#8A9A8E; --accent:#C8F542; --accent2:#6EE7A0; --on:#0B1A12; --line:#1E3A28; --wash:#1C3A24; --good:#7DCF7A; --warn:#F5C542; --bad:#E85D4C; --hero1:#1F5230; --hero2:#0E2217; --heroText:#F4F1E8; --glass:rgba(255,255,255,.07); --glow:rgba(200,245,66,.35); }
  .t-midnight  { --bg:#0A1022; --bg2:#121A33; --text:#EAF0FF; --muted:#8B97B8; --accent:#4FD8FF; --accent2:#7B6CFF; --on:#06101F; --line:#1F2A4A; --wash:#16254A; --good:#5BE3A8; --warn:#FFD166; --bad:#FF6B6B; --hero1:#23367A; --hero2:#0D1430; --heroText:#EAF0FF; --glass:rgba(255,255,255,.07); --glow:rgba(79,216,255,.35); }
  .t-sunset    { --bg:#1A0F1F; --bg2:#26162D; --text:#FFF1E8; --muted:#B39AAE; --accent:#FF9A4C; --accent2:#FF4D8D; --on:#1A0F1F; --line:#3A2442; --wash:#3A1E36; --good:#7EE0A1; --warn:#FFD166; --bad:#FF5C5C; --hero1:#6A2448; --hero2:#241028; --heroText:#FFF1E8; --glass:rgba(255,255,255,.07); --glow:rgba(255,120,90,.38); }
  .t-clubhouse { --bg:#0E1C16; --bg2:#16291F; --text:#F5EEDC; --muted:#9AA894; --accent:#E3B55B; --accent2:#F6DD95; --on:#1A1406; --line:#243A2E; --wash:#2A3322; --good:#86D39A; --warn:#E3B55B; --bad:#E06A55; --hero1:#1F4632; --hero2:#0E1C16; --heroText:#F5EEDC; --glass:rgba(255,255,255,.06); --glow:rgba(227,181,91,.35); }
  .t-carbon    { --bg:#111214; --bg2:#1B1D21; --text:#F2F2F2; --muted:#9097A0; --accent:#FF6A1A; --accent2:#FFB020; --on:#140800; --line:#2A2D33; --wash:#2A1C12; --good:#6BD68C; --warn:#FFB020; --bad:#FF4D4D; --hero1:#2E3138; --hero2:#141518; --heroText:#F2F2F2; --glass:rgba(255,255,255,.06); --glow:rgba(255,106,26,.35); }
  .t-links     { --bg:#F4EDE1; --bg2:#FFFBF4; --text:#2B1E14; --muted:#7A6A5A; --accent:#C8553D; --accent2:#E88A4F; --on:#FFFFFF; --line:#E6D8C4; --wash:#F6DDD2; --good:#3E8E4F; --warn:#B8860B; --bad:#B8322A; --hero1:#3F6B3A; --hero2:#27452A; --heroText:#FFF8EC; --glass:rgba(255,255,255,.16); --glow:rgba(200,85,61,.28); }
  .t-glacier   { --bg:#EEF3F8; --bg2:#FFFFFF; --text:#0F1B2D; --muted:#5E6E84; --accent:#2F6BFF; --accent2:#22C3E6; --on:#FFFFFF; --line:#D6E0EC; --wash:#DCE7FF; --good:#1E9E62; --warn:#C98A00; --bad:#D6453D; --hero1:#2F6BFF; --hero2:#1AA6D6; --heroText:#FFFFFF; --glass:rgba(255,255,255,.2); --glow:rgba(47,107,255,.3); }
  .t-light     { --bg:#F6F3EA; --bg2:#FFFFFF; --text:#122018; --muted:#5A6B5E; --accent:#4F8A12; --accent2:#8CC63F; --on:#FFFFFF; --line:#DDE3D8; --wash:#E7F4C8; --good:#2E7D32; --warn:#B8860B; --bad:#C0392B; --hero1:#3D7A1A; --hero2:#1F4A12; --heroText:#FFFFFF; --glass:rgba(255,255,255,.16); --glow:rgba(79,138,18,.28); }
  .t-hc        { --bg:#000; --bg2:#000; --text:#FFF; --muted:#E8E8E8; --accent:#E6FF00; --accent2:#E6FF00; --on:#000; --line:#FFF; --wash:#1A1A00; --good:#00FF6A; --warn:#FFE600; --bad:#FF2D2D; --hero1:#000; --hero2:#000; --heroText:#FFF; --glass:rgba(255,255,255,0); --glow:rgba(0,0,0,0); }

  /* ---------- Phone ---------- */
  .phone { width: 390px; height: 844px; border-radius: 54px; padding: 12px; background: #0a0a0a; box-shadow: 0 30px 60px rgba(0,0,0,.35), inset 0 0 0 2px #333; flex: none; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 43px; overflow: hidden; background: var(--bg); color: var(--text); }
  .status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 8px 28px 0 34px; font-weight: 700; font-size: 15px; }
  .island { position: absolute; top: 11px; left: 50%; width: 118px; height: 34px; margin-left: -59px; background: #000; border-radius: 20px; z-index: 5; }
  .sicons { display: flex; gap: 6px; align-items: center; }
  .content { padding: 4px 18px 120px; display: flex; flex-direction: column; gap: 12px; }

  /* header */
  .hdr { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; box-shadow: 0 6px 16px var(--glow); }
  .t-hc .mark { box-shadow: none; }
  .word { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
  .word sup { font-size: 10px; opacity: .6; }
  .iconbtn { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; background: var(--bg2); border: 1px solid var(--line); }
  .t-hc .iconbtn { border-width: 2px; }
  .kicker { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .h1 { font-size: 30px; font-weight: 700; letter-spacing: -.8px; line-height: 1.05; }

  /* hero */
  .hero { position: relative; border-radius: 26px; padding: 18px; overflow: hidden; background: linear-gradient(150deg, var(--hero1), var(--hero2)); color: var(--heroText); border: 1px solid rgba(255,255,255,.08); }
  .t-hc .hero { border: 2px solid #fff; }
  .hero .topo, .live .topo { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .18; }
  .t-hc .live .topo { display: none; }
  .t-hc .hero .topo { display: none; }
  .search { position: relative; display: flex; align-items: center; gap: 10px; height: 52px; border-radius: 16px; padding: 0 14px; background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.14); font-size: 15px; color: rgba(255,255,255,.72); }
  .t-links .search, .t-glacier .search, .t-light .search { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); color: rgba(255,255,255,.9); }
  .t-hc .search { background: #000; border: 2px solid #fff; color: #fff; }
  .hero-row { position: relative; display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .near { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--accent); color: var(--on); font-weight: 700; font-size: 14px; box-shadow: 0 6px 18px var(--glow); }
  .hero-meta { font-size: 12px; opacity: .75; }

  /* course card */
  .card { border-radius: 22px; background: var(--bg2); border: 1px solid var(--line); padding: 14px 16px; }
  .t-hc .card { border-width: 2px; }
  .course { display: flex; gap: 12px; align-items: center; }
  .thumb { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(160deg, var(--wash), var(--bg2)); display: grid; place-items: center; border: 1px solid var(--line); flex: none; }
  .ctitle { font-size: 17px; font-weight: 700; }
  .cmeta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip { font-size: 10.5px; font-weight: 700; letter-spacing: .4px; padding: 4px 9px; border-radius: 999px; background: var(--wash); color: var(--text); }
  .chip.acc { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
  .t-links .chip.acc, .t-glacier .chip.acc, .t-light .chip.acc { color: var(--accent); }
  .t-hc .chip { border: 1.5px solid #fff; background: #000; }

  /* start tiles */
  .starts { display: grid; grid-template-columns: 1.35fr 1fr; gap: 12px; }
  .tile { position: relative; border-radius: 24px; height: 118px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .tile.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on); box-shadow: 0 14px 30px var(--glow), inset 0 1px 0 rgba(255,255,255,.35); }
  .tile.secondary { background: var(--bg2); border: 1.5px solid var(--line); color: var(--text); }
  .t-hc .tile.secondary { border: 2px solid #fff; }
  .tile .num { font-size: 48px; font-weight: 700; letter-spacing: -2px; line-height: .9; }
  .tile .lbl { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
  .tile .go { position: absolute; right: 14px; top: 14px; width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: rgba(0,0,0,.14); }
  .tile.secondary .go { background: var(--wash); }
  .tile .shine { position: absolute; right: -40px; bottom: -60px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.35), transparent 65%); }
  .t-hc .tile .shine { display: none; }

  /* quick actions */
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .qa { border-radius: 20px; background: var(--bg2); border: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .t-hc .qa { border-width: 2px; }
  .qa .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; }
  .qa .t { font-size: 13px; font-weight: 700; }

  /* history */
  .sect { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; }
  .sect .h { font-size: 19px; font-weight: 700; letter-spacing: -.3px; }
  .sect .a { font-size: 13px; font-weight: 700; color: var(--accent); }
  .hist { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .badge { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
  .hist .score { margin-left: auto; text-align: right; }
  .hist .score b { display: block; font-size: 24px; letter-spacing: -.5px; }
  .hist .score span { font-size: 11px; color: var(--muted); }

  /* tab bar */
  .fade { position:absolute; left:0; right:0; bottom:0; height:150px; background:linear-gradient(to bottom, transparent, var(--bg) 55%); pointer-events:none; }
  .tabbar { position: absolute; left: 16px; right: 16px; bottom: 26px; height: 68px; border-radius: 26px; background: color-mix(in srgb, var(--bg2) 82%, transparent); backdrop-filter: blur(20px); border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-around; padding: 0 8px; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  .t-links .tabbar, .t-glacier .tabbar, .t-light .tabbar { box-shadow: 0 12px 30px rgba(40,30,20,.12); }
  .t-hc .tabbar { border-width: 2px; background: #000; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--muted); width: 74px; padding: 8px 0; border-radius: 18px; }
  .tab.on { color: var(--text); background: var(--wash); }
  .t-hc .tab.on { background: #E6FF00; color: #000; }
  .homeind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--text); opacity: .6; }

  /* live round */
  .live { position: relative; border-radius: 26px; padding: 16px; background: linear-gradient(150deg, var(--hero1), var(--hero2)); color: var(--heroText); overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
  .t-hc .live { border: 2px solid #E6FF00; }
  .pulse { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
  .pulse i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 30%, transparent); }
  .live .big { display: flex; align-items: flex-end; justify-content: space-between; margin: 14px 0 12px; }
  .live .hole { font-size: 56px; font-weight: 700; letter-spacing: -2px; line-height: .85; }
  .live .hole small { font-size: 14px; letter-spacing: 1px; opacity: .7; display: block; margin-bottom: 6px; font-weight: 700; }
  .live .stat { text-align: right; }
  .live .stat b { font-size: 26px; display: block; }
  .live .stat span { font-size: 12px; opacity: .7; }
  .prog { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; margin-bottom: 14px; }
  .prog i { height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); }
  .prog i.d { background: var(--accent); }
  .prog i.c { background: #fff; }
  .btn { height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 700; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on); box-shadow: 0 10px 24px var(--glow), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.glass { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: var(--heroText); }
  .btn.secondary { background: var(--bg2); border: 1.5px solid var(--line); color: var(--text); }
  .btn.ghost { background: transparent; border: 1.5px dashed var(--line); color: var(--text); }
  .btn.danger { background: linear-gradient(135deg, var(--bad), color-mix(in srgb, var(--bad) 70%, #000)); color: #fff; box-shadow: 0 10px 24px color-mix(in srgb, var(--bad) 35%, transparent); }
  .t-hc .btn.glass { border: 2px solid #fff; background: #000; }
  .t-hc .btn.secondary { border-width: 2px; }

  /* menu */
  .mtitle { font-size: 32px; font-weight: 700; letter-spacing: -.8px; }
  .grp-h { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 6px 4px -4px; }
  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sw { border-radius: 18px; padding: 7px 7px 9px; background: var(--bg2); border: 1.5px solid var(--line); position: relative; }
  .sw.on { border: 2px solid var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
  .sw .mini { height: 64px; border-radius: 12px; background: var(--sbg); padding: 7px; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
  .sw .mini .hb { height: 18px; border-radius: 6px; background: linear-gradient(135deg, var(--sh1), var(--sh2)); }
  .sw .mini .bt { display: flex; gap: 4px; }
  .sw .mini .bt i { height: 16px; border-radius: 5px; flex: 1.3; background: linear-gradient(135deg, var(--sa1), var(--sa2)); }
  .sw .mini .bt i + i { flex: 1; background: var(--sc); }
  .sw .mini .ln { height: 5px; width: 60%; border-radius: 3px; background: var(--st); opacity: .5; }
  .sw .nm { font-size: 11.5px; font-weight: 700; margin-top: 7px; text-align: center; }
  .sw .ck { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .list { border-radius: 22px; background: var(--bg2); border: 1px solid var(--line); overflow: hidden; }
  .t-hc .list { border-width: 2px; }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 60px; }
  .li + .li { border-top: 1px solid var(--line); }
  .li .sq { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .li .tx { flex: 1; }
  .li .tx b { display: block; font-size: 15px; }
  .li .tx span { font-size: 12px; color: var(--muted); }
  .seg { display: flex; background: var(--wash); border-radius: 12px; padding: 3px; }
  .seg i { font-style: normal; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 9px; color: var(--muted); }
  .seg i.on { background: var(--accent); color: var(--on); }
  .foot { font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.5; margin-top: 4px; }

  /* gallery */
  .gal { display: grid; grid-template-columns: repeat(3, 360px); gap: 28px; }
  .gcard { border-radius: 28px; overflow: hidden; background: var(--bg); color: var(--text); box-shadow: 0 20px 40px rgba(0,0,0,.18); border: 1px solid rgba(0,0,0,.06); }
  .gcard .top { padding: 18px 18px 0; display: flex; justify-content: space-between; align-items: center; }
  .gcard .nm { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .gcard .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: var(--wash); color: var(--text); }
  .gcard .desc { padding: 6px 18px 0; font-size: 13px; color: var(--muted); min-height: 36px; }
  .gcard .demo { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; }
  .gcard .mhero { height: 64px; border-radius: 18px; background: linear-gradient(150deg, var(--hero1), var(--hero2)); color: var(--heroText); padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden; }
  .t-hc.gcard .mhero { border: 2px solid #fff; }
  .gcard .mhero .topo { position:absolute; inset:0; width:100%; height:100%; opacity:.18; }
  .t-hc.gcard .mhero .topo { display:none; }
  .gcard .mhero b { font-size: 16px; position: relative; }
  .gcard .mhero span { font-size: 11px; opacity: .75; display: block; font-weight: 400; margin-top: 2px; }
  .gcard .mbtns { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }
  .gcard .mbtns .btn { height: 46px; font-size: 14px; border-radius: 14px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(128,128,128,.25); }

  /* buttons sheet */
  .bsheet { width: 560px; border-radius: 32px; background: var(--bg); color: var(--text); padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
  .bsheet .lab { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin-bottom: -6px; }
  .bsheet .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pressed { transform: scale(.97); filter: brightness(.92); box-shadow: none !important; }
  .fab { width: 64px; height: 64px; border-radius: 22px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 10px 24px var(--glow); }

  /* before */
  .old .content { gap: 12px; padding-top: 10px; }
  .old .obtn { min-height: 64px; border-radius: 16px; display: grid; place-items: center; font-size: 20px; font-weight: 700; padding: 0 18px; text-align: center; }
  .old .obtn.p { background: #C8F542; color: #0B1A12; }
  .old .obtn.s { background: #13261B; border: 2px solid #1E3A28; color: #F4F1E8; }
  .old .obtn.g { border: 1px solid #1E3A28; color: #F4F1E8; }
  .old .oreg { background: #0B1A12; border-top: 1px solid #1E3A28; position: absolute; bottom: 0; left: 0; right: 0; height: 84px; display: flex; justify-content: space-around; padding-top: 10px; font-size: 10px; color: #8A9A8E; }
  .old .oreg div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .old .oreg .on { color: #F4F1E8; }
  .old .onav { height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; border-bottom: 1px solid #1E3A28; }
  .notes { max-width: 380px; font-size: 16px; line-height: 1.55; }
  .notes h3 { font-size: 20px; margin: 0 0 10px; }
  .notes li { margin: 0 0 10px 18px; }
</style>
</head>

<div id="root"></div>
<script>

function relBadge(rel){
  const n = parseInt(rel,10);
  const col = rel==='E' ? 'var(--good)' : n<=2 ? 'var(--good)' : n<=6 ? 'var(--warn)' : 'var(--bad)';
  return `<div class="badge" style="background:color-mix(in srgb, ${col} 18%, transparent); color:${col}; border:2px solid color-mix(in srgb, ${col} 55%, transparent)">${rel}</div>`;
}
const history = (rows) => rows.map(([name, meta, rel, score, star]) => `<div class="card hist">
  ${relBadge(rel)}
  <div><div class="ctitle" style="font-size:15.5px">${name}</div><div class="cmeta">${meta}</div></div>
  <div class="score"><b>${score}</b><span>${star ? I.star('var(--accent)',14) : I.star('var(--muted)',14,false)}</span></div>
</div>`).join('');

function menu(t, sel){
  const sw = THEMES.map(th => { const [bg,h1,h2,a1,a2,c,tx]=SW[th.id];
    return `<div class="sw ${th.id===sel?'on':''}" style="--sbg:${bg};--sh1:${h1};--sh2:${h2};--sa1:${a1};--sa2:${a2};--sc:${c};--st:${tx};${th.id==='hc'?'--sc:#000;':''}">
      ${th.id===sel?`<div class="ck">${I.check('var(--on)',13)}</div>`:''}
      <div class="mini" ${th.id==='hc'?'style="border:1.5px solid #fff"':''}><div class="hb" ${th.id==='hc'?'style="border:1px solid #fff"':''}></div><div class="bt"><i></i><i ${th.id==='hc'?'style="border:1px solid #fff"':''}></i></div><div class="ln"></div></div>
      <div class="nm">${th.name}</div></div>`; }).join('');
  const sq = (col, icon) => `<div class="sq" style="background:color-mix(in srgb, ${col} 20%, transparent)">${icon(col,19)}</div>`;
  return `<div class="phone t-${t}"><div class="screen">${statusBar()}<div class="content" style="padding-bottom:40px">
    <div class="hdr"><div class="mtitle">Menu</div><div class="iconbtn" style="font-weight:700;font-size:13px;width:auto;padding:0 14px">Done</div></div>
    <div class="grp-h">Appearance · Color theme</div>
    <div class="themes">${sw}</div>
    <div class="grp-h">Course</div>
    <div class="list">
      <div class="li">${sq('var(--accent)',I.ruler)}<div class="tx"><b>Distance units</b><span>Nearby search radius</span></div><div class="seg"><i class="on">mi</i><i>km</i></div></div>
      <div class="li">${sq('var(--accent2)',I.sheet)}<div class="tx"><b>Thunderbird pin sheet</b><span>Sheet B · this week</span></div>${I.chev('var(--muted)')}</div>
    </div>
    <div class="grp-h">Your data</div>
    <div class="list">
      <div class="li">${sq('var(--warn)',I.bag)}<div class="tx"><b>Bag</b><span>14 clubs · 11 carries set</span></div>${I.chev('var(--muted)')}</div>
      <div class="li">${sq('var(--good)',I.swap)}<div class="tx"><b>Export / Restore rounds</b><span>Back up to Files</span></div>${I.chev('var(--muted)')}</div>
      <div class="li">${sq('var(--bad)',I.plus)}<div class="tx"><b>Contribute a course</b><span>Map a missing tee or green</span></div>${I.chev('var(--muted)')}</div>
    </div>
    <div class="foot">Course data © OpenStreetMap contributors · Golf Courses API<br>Build 1.0.0 (36)</div>
  </div></div></div>`;
}
