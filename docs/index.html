<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShotTraxx™</title>
  <meta name="description" content="ShotTraxx™ privacy policy.">
  <link rel="canonical" href="https://bigbaird83.github.io/ShotTrax/privacy/">
  <style>
    :root {
      color-scheme: light;
      --ink: #142018;
      --green: #0B1A12;
      --cream: #F7F4EC;
      --lime: #C8F542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }
    header {
      background: var(--green);
      color: #F4F1E8;
      padding: 1.5rem 1.25rem 1.75rem;
    }
    main, header { max-width: 40rem; margin: 0 auto; }
    main { padding: 1.5rem 1.25rem 3rem; }
    h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 0.35rem; }
    p { font-size: 1.0625rem; line-height: 1.55; margin: 0 0 1rem; }
    a {
      color: var(--green);
      font-weight: 650;
    }
    header a { color: var(--lime); }
  </style>
</head>
<body>
  <header>
    <h1>ShotTraxx™</h1>
    <p>Phone GPS golf shot tracker.</p>
  </header>
  <main>
    <p><a href="privacy/">Privacy policy</a></p>
    <p>The stable address for App Store Connect is <a href="privacy/">https://bigbaird83.github.io/ShotTrax/privacy/</a>.</p>
  </main>
</body>
</html>
