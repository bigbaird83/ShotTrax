# Production iOS → external TestFlight group "friends".
#
# Run for the next production build (build 80 and earlier are not touched):
#   eas workflow:run .eas/workflows/production-ios-testflight.yml
#   npm run eas:ios:testflight
#
# "friends" is an App Store Connect EXTERNAL group. eas submit --groups and
# eas.json submit.groups only accept INTERNAL groups, so this uses the
# pre-packaged testflight job. submit_beta_review defaults to true when
# external_groups is set; it is set explicitly so Beta App Review always runs.
# Submit profile "production" reads ascAppId from eas.json. Do not put secrets here.

name: Production iOS to TestFlight friends

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  testflight:
    name: Distribute to TestFlight friends
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      external_groups: ["friends"]
      submit_beta_review: true
      changelog: |
        Production build for the external TestFlight group friends.
